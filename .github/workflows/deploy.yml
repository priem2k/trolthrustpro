name: Auto Build Trolling Motor & Marine Calculator, +3 Daily Reviews, Sitemap & SEO Ping

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Berjalan otomatis setiap hari pukul 03:30 UTC untuk menerbitkan +3 artikel review baru & update sitemap
    - cron: '30 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Trolling Motor Calculator, +3 Daily Reviews, Sitemaps & Ping IndexNow
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python generate_trolling_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
